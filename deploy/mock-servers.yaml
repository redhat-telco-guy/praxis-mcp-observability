# ── Translator MCP ───────────────────────────────────────────
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: translator-mcp-script
  labels:
    app: translator-mcp
data:
  server.py: |
    #!/usr/bin/env python3
    """Mock Translator MCP server — translate / detect_language tools."""
    import json, time, random
    from http.server import HTTPServer, BaseHTTPRequestHandler

    TOOLS = [
        {
            "name": "translate",
            "description": "Translate text between languages",
            "inputSchema": {
                "type": "object",
                "properties": {
                    "text": {"type": "string"},
                    "from_lang": {"type": "string"},
                    "to_lang": {"type": "string"},
                },
                "required": ["text", "to_lang"],
            },
        },
        {
            "name": "detect_language",
            "description": "Detect the language of input text",
            "inputSchema": {
                "type": "object",
                "properties": {
                    "text": {"type": "string"},
                },
                "required": ["text"],
            },
        },
    ]

    LANG_NAMES = {"en": "English", "es": "Spanish", "fr": "French", "de": "German", "ja": "Japanese", "zh": "Chinese", "ko": "Korean", "pt": "Portuguese"}

    def handle_rpc(body):
        rid = body.get("id")
        method = body.get("method", "")
        params = body.get("params", {})

        if method == "initialize":
            return {"jsonrpc": "2.0", "id": rid, "result": {"protocolVersion": "2025-11-25", "serverInfo": {"name": "translator-mcp", "version": "1.0.0"}, "capabilities": {"tools": {}}}}

        if method == "server/discover":
            return {"jsonrpc": "2.0", "id": rid, "result": {"protocolVersion": "2025-11-25", "serverInfo": {"name": "translator-mcp", "version": "1.0.0"}, "capabilities": {"tools": {}}}}

        if method == "tools/list":
            return {"jsonrpc": "2.0", "id": rid, "result": {"tools": TOOLS}}

        if method == "tools/call":
            tool = params.get("name", "")
            args = params.get("arguments", {})
            # Simulate API latency: 200-500ms
            time.sleep(random.uniform(0.2, 0.5))

            if tool == "translate":
                text = args.get("text", "")
                from_lang = args.get("from_lang", "en")
                to_lang = args.get("to_lang", "es")
                to_name = LANG_NAMES.get(to_lang, to_lang)
                translated = f"[{to_name}] {text}"
                result = {"content": [{"type": "text", "text": json.dumps({
                    "translated": translated,
                    "from": from_lang,
                    "to": to_lang,
                    "characters": len(text),
                })}]}
                return {"jsonrpc": "2.0", "id": rid, "result": result}

            if tool == "detect_language":
                text = args.get("text", "")
                result = {"content": [{"type": "text", "text": json.dumps({
                    "language": "en",
                    "language_name": "English",
                    "confidence": round(random.uniform(0.85, 0.99), 3),
                    "characters_analyzed": len(text),
                })}]}
                return {"jsonrpc": "2.0", "id": rid, "result": result}

            return {"jsonrpc": "2.0", "id": rid, "error": {"code": -32601, "message": f"Unknown tool: {tool}"}}

        return {"jsonrpc": "2.0", "id": rid, "error": {"code": -32601, "message": f"Unknown method: {method}"}}

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            body = json.loads(self.rfile.read(length)) if length else {}
            resp = handle_rpc(body)
            out = json.dumps(resp).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(out)))
            self.end_headers()
            self.wfile.write(out)

        def do_GET(self):
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(b"translator-mcp OK\n")

        def log_message(self, fmt, *args):
            pass

    print("translator-mcp listening on :3001")
    HTTPServer(("0.0.0.0", 3001), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: translator-mcp
  labels:
    app: translator-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: translator-mcp
  template:
    metadata:
      labels:
        app: translator-mcp
    spec:
      containers:
        - name: server
          image: python:3.11-alpine
          command: ["python3", "/app/server.py"]
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: translator-mcp-script
